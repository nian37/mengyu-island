<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b0e1f">
<title>梦屿 · 梦角字卡传讯</title>
<meta name="description" content="和梦角一起的字卡传讯小世界">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="梦屿">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="desk">
  <div class="phone" id="phone">
    <div class="notch"></div>
    <div class="statusbar">
      <div class="sb-left"><span id="sb-time">09:41</span></div>
      <div class="sb-right">▮▮▮▯  ▸   🔋<span id="sb-batt">87</span>%</div>
    </div>
    <div class="screen">
      <!-- 主界面（手机桌面） -->
      <div class="home" id="home">
        <div class="home-clock">
          <div class="clock-time" id="clockTime">--:--</div>
          <div class="clock-date" id="clockDate"></div>
        </div>
        <div class="widget-companion" id="homeWidget" title="打开梦角陪伴"></div>
        <div class="appgrid" id="appgrid"></div>
      </div>
      <!-- 应用页 -->
      <div class="appview" id="appview" hidden>
        <div class="appbar">
          <button class="appbar-back" id="appbarBack">‹</button>
          <div class="appbar-title" id="appbarTitle"></div>
        </div>
        <div class="appbody" id="appbody"></div>
      </div>
    </div>
    <div class="homeind">
      <button class="homedot" id="homedot" title="回到主屏幕"></button>
    </div>
  </div>
</div>

<div class="modal-root" id="modalRoot" hidden></div>

<!-- 常驻的隐藏文件选择控件：复用它们唤起系统相册/相机（动态创建的 input 在部分浏览器无法拉起选择器） -->
<input type="file" accept="image/*" class="picker-hide" id="pickerImage">
<input type="file" accept="image/*" capture="environment" class="picker-hide" id="pickerCamera">

<script src="js/core.js"></script>
<script src="js/shell.js"></script>
<script src="js/app-wallet.js"></script>
<script src="js/app-chat.js"></script>
<script src="js/app-period.js"></script>
<script src="js/app-mail.js"></script>
<script src="js/app-location.js"></script>
<script src="js/app-schedule.js"></script>
<script src="js/app-diary.js"></script>
<script src="js/app-profile.js"></script>
<script src="js/app-myself.js"></script>
<script src="js/app-anniv.js"></script>
<script src="js/app-dreamsettings.js"></script>
<script src="js/app-group.js"></script>
<script src="js/app-music.js"></script>
<script src="js/app-companion.js"></script>
<script src="js/app-pet.js"></script>
<script src="js/app-games.js"></script>
<script src="js/app-shop.js"></script>
<script src="js/app-food.js"></script>
<script src="js/app-backup.js"></script>
<script src="js/app-settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
